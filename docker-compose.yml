services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /tmp/data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "access-mock-key"
      MINIO_ROOT_PASSWORD: "secret-mock-key"
    ports:
      - "9000:9000"
      - "9090:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:26.10
    volumes:
      - ./tests/sql/sample.sql:/docker-entrypoint-initdb.d/sample.sql:ro
    environment:
      MYSQL_DATABASE: "db"
      MYSQL_USER: "user"
      MYSQL_PASSWORD: "password"
      MYSQL_ROOT_PASSWORD: "password"
    ports:
      - "9001:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 15

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "app"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "password"
    ports:
      - "9002:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:9
    environment:
      MONGO_INITDB_ROOT_USERNAME: "root"
      MONGO_INITDB_ROOT_PASSWORD: "password"
    ports:
      - "9003:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
