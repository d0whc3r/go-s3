services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "access-mock-key"
      MINIO_ROOT_PASSWORD: "secret-mock-key"
    ports:
      - "9000:9000"
      - "9090:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  db:
    image: mysql:8.4
    volumes:
      - ./tests/sql/sample.sql:/docker-entrypoint-initdb.d/sample.sql:ro
    environment:
      MYSQL_DATABASE: "db"
      MYSQL_USER: "user"
      MYSQL_PASSWORD: "password"
      MYSQL_ROOT_PASSWORD: "password"
    ports:
      - "9001:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 15
