name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Build, Vet & Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -ldflags="-s -w" -o gos3 .

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: |
          mkdir -p coverage
          go test -race -coverprofile=coverage/coverage.out ./...

      - name: Integration tests
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=access-mock-key \
            -e MINIO_ROOT_PASSWORD=secret-mock-key \
            cgr.dev/chainguard/minio:latest server /tmp/data
          docker run -d --name mysql \
            -p 9001:3306 \
            -e MYSQL_DATABASE=db \
            -e MYSQL_USER=user \
            -e MYSQL_PASSWORD=password \
            -e MYSQL_ROOT_PASSWORD=password \
            -v "${{ github.workspace }}/tests/sql/sample.sql:/docker-entrypoint-initdb.d/sample.sql:ro" \
            mysql:26.10
          docker run -d --name postgres \
            -p 9002:5432 \
            -e POSTGRES_DB=app \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=password \
            postgres:17-alpine
          trap 'docker rm -f minio mysql postgres >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              break
            fi
            sleep 2
          done
          for i in $(seq 1 30); do
            if docker exec mysql mysqladmin ping -h localhost -ppassword --silent; then
              break
            fi
            sleep 2
          done
          for i in $(seq 1 30); do
            if docker exec postgres pg_isready -U postgres -d app >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec postgres psql -U postgres -d app -c "CREATE TABLE items (id SERIAL PRIMARY KEY, name TEXT NOT NULL); INSERT INTO items (name) VALUES ('one'), ('two');"
          go test -race -tags=integration -v ./tests/...
        env:
          ENDPOINT: "http://localhost:9000"
          ACCESS_KEY: "access-mock-key"
          SECRET_KEY: "secret-mock-key"
          REGION: "us-east-1"
          MAX_RETRIES: "3"
          FORCE_PATH_STYLE: "true"
          SSL_ENABLED: "false"
          MYSQL_HOST: "localhost"
          MYSQL_PORT: "9001"
          MYSQL_USER: "root"
          MYSQL_PASSWORD: "password"
          MYSQL_DATABASE: "classicmodels"
          POSTGRES_HOST: "localhost"
          POSTGRES_PORT: "9002"
          POSTGRES_USER: "postgres"
          POSTGRES_PASSWORD: "password"
          POSTGRES_DATABASE: "app"
          POSTGRES_SSLMODE: "disable"

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  release:
    name: GitHub Release
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    outputs:
      version: ${{ steps.semver.outputs.version }}
      released: ${{ steps.semver.outputs.released }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Compute semantic version
        id: semver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
            echo "version=${VER}" >> "$GITHUB_OUTPUT"
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "Manual tag release: v${VER}"
            exit 0
          fi

          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [[ -z "${LAST_TAG}" ]]; then
            LAST_TAG="v0.0.0"
            RANGE="HEAD"
          else
            # Skip if HEAD already has a release tag.
            if git tag --points-at HEAD | grep -q '^v'; then
              VER="${LAST_TAG#v}"
              echo "version=${VER}" >> "$GITHUB_OUTPUT"
              echo "released=false" >> "$GITHUB_OUTPUT"
              echo "HEAD is already tagged (${LAST_TAG}), skipping release."
              exit 0
            fi
            RANGE="${LAST_TAG}..HEAD"
          fi

          CLEAN_VER="${LAST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${CLEAN_VER%%-*}"
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}

          COMMITS=$(git log "${RANGE}" --format='%s%n%b')
          BUMP=""
          if echo "${COMMITS}" | grep -Eq '^[a-z]+(\([^)]+\))?!:|^BREAKING CHANGE:'; then
            BUMP="major"
          elif echo "${COMMITS}" | grep -Eq '^feat(\([^)]+\))?:'; then
            BUMP="minor"
          elif echo "${COMMITS}" | grep -Eq '^(fix|perf)(\([^)]+\))?:'; then
            BUMP="patch"
          fi

          if [[ -z "${BUMP}" ]]; then
            echo "version=${CLEAN_VER}" >> "$GITHUB_OUTPUT"
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No release-worthy commits since ${LAST_TAG}."
            exit 0
          fi

          case "${BUMP}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEXT_VER="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=${NEXT_VER}" >> "$GITHUB_OUTPUT"
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "Computed next version: v${NEXT_VER} (${BUMP} bump from ${LAST_TAG})"

      - name: Build release binaries
        if: steps.semver.outputs.released == 'true'
        run: |
          make build-all GOS3_VERSION="${{ steps.semver.outputs.version }}"
          (cd build && sha256sum * > SHA256SUMS.txt)

      - name: Publish GitHub Release
        if: steps.semver.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.semver.outputs.version }}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists, uploading/updating assets."
            gh release upload "${TAG}" build/* --clobber
          else
            gh release create "${TAG}" build/* \
              --target "${GITHUB_SHA}" \
              --title "${TAG}" \
              --generate-notes
          fi

  docker:
    name: Build & Publish Docker Image
    needs: [test, release]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: d0whc3r/gos3
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.released == 'true' }}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
