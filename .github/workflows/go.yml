name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Build, Vet & Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -ldflags="-s -w" -o gos3 .

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: |
          mkdir -p coverage
          go test -race -coverprofile=coverage/coverage.out ./...

      - name: Integration tests
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=access-mock-key \
            -e MINIO_ROOT_PASSWORD=secret-mock-key \
            cgr.dev/chainguard/minio:latest server /tmp/data
          docker run -d --name mysql \
            -p 9001:3306 \
            -e MYSQL_DATABASE=db \
            -e MYSQL_USER=user \
            -e MYSQL_PASSWORD=password \
            -e MYSQL_ROOT_PASSWORD=password \
            -v "${{ github.workspace }}/tests/sql/sample.sql:/docker-entrypoint-initdb.d/sample.sql:ro" \
            mysql:8.4
          docker run -d --name postgres \
            -p 9002:5432 \
            -e POSTGRES_DB=app \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=password \
            postgres:17-alpine
          trap 'docker rm -f minio mysql postgres >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              break
            fi
            sleep 2
          done
          for i in $(seq 1 30); do
            if docker exec mysql mysqladmin ping -h localhost -ppassword --silent; then
              break
            fi
            sleep 2
          done
          for i in $(seq 1 30); do
            if docker exec postgres pg_isready -U postgres -d app >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec postgres psql -U postgres -d app -c "CREATE TABLE items (id SERIAL PRIMARY KEY, name TEXT NOT NULL); INSERT INTO items (name) VALUES ('one'), ('two');"
          go test -race -tags=integration -v ./tests/...
        env:
          ENDPOINT: "http://localhost:9000"
          ACCESS_KEY: "access-mock-key"
          SECRET_KEY: "secret-mock-key"
          REGION: "us-east-1"
          MAX_RETRIES: "3"
          FORCE_PATH_STYLE: "true"
          SSL_ENABLED: "false"
          MYSQL_HOST: "localhost"
          MYSQL_PORT: "9001"
          MYSQL_USER: "root"
          MYSQL_PASSWORD: "password"
          MYSQL_DATABASE: "classicmodels"
          POSTGRES_HOST: "localhost"
          POSTGRES_PORT: "9002"
          POSTGRES_USER: "postgres"
          POSTGRES_PASSWORD: "password"
          POSTGRES_DATABASE: "app"
          POSTGRES_SSLMODE: "disable"

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker:
    name: Build & Publish Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(cat .version)" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: d0whc3r/gos3
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
